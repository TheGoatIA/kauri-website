name: Deploy to production

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute date-based build tag
        id: tag
        run: |
          DATE=$(date +%Y%m%d)
          EXISTING=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions?per_page=100" \
            | grep -o "\"$DATE\.[0-9]*\"" | tr -d '"' | sort -t. -k2 -n | tail -1)
          if [ -z "$EXISTING" ]; then
            BUILD=1
          else
            BUILD=$(( $(echo "$EXISTING" | cut -d. -f2) + 1 ))
          fi
          echo "value=${DATE}.${BUILD}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/kauri/website-app
            docker compose pull
            docker compose up -d
            sleep 3
            curl -f http://localhost:15020 > /dev/null

      - name: Print deployed tag
        run: echo "Deployed ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}"
